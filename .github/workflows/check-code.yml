##
## Quality checks
##
name: check
on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:

  code:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/checkout@v7

      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-go: false
